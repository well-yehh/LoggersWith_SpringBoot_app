spring.application.name=LoggersWith_SpringBoot_app

logging.level.dear.darling.loggerswith_springboot_app.Controller = debug
logging.level.dear.darling.loggerswith_springboot_app.Service = trace

# To specify our own pattern
logging.pattern.console = %c  :  %p --> %m  :: %d   %n

# To get logging messages into file
logging.file.name = logger/log.txt
logging.patter.file = %d : %c :  %p -->  %m :  %M :  %n

